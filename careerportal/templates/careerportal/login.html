<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

{% if form.errors %}
    <div style="color: red;">
        Invalid username or password
    </div>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <label>Username:</label><br>
    {{ form.username }}<br><br>

    <label>Password:</label><br>
    {{ form.password }}<br><br>

    <button type="submit">Login</button>
</form>

<br>
<a href="{% url 'register' %}">Create account</a>

</body>
</html>
