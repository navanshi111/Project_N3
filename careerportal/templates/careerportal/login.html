{% extends "careerportal/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>
<p class="text-muted">Access Your CareerPortal account</p>

{% if form.errors %}
    <div style="color: red;">
        Invalid username or password
    </div>
{% endif %}

<div class="card mb-4">
    <div class="card-body">
        <h2 class="card-title">Sign In</h2>

<form method="POST">
    {% csrf_token %}

    <label>Username:</label><br>
    {{ form.username }}<br><br>

    <label>Password:</label><br>
    {{ form.password }}<br><br>

    <button type="submit">Login</button>
</form>
    </div>
</div>

<a href="{% url 'register' %}">Create account</a>

{% endblock %}
