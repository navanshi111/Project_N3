<h1> Job Listings </h1>

{% if request.user.is_authenticated %}
    <a href="{% url 'post_job' %}">+ Post a Job</a>
{% endif %}

{% for job in jobs%}
    <div>
        <h2>
            <a href= "{% url 'job_detail' job.id %}">
                {{ job.title }}
            </a>
        </h2>
        <p>{{ job.description }}</p>
        <p>Posted by {{ job.created_by.username }}</p>
    </div>
{% endfor %}
