<!DOCTYPE html>
<html>
<head><title>Apply for {{ job.title }}</title></head>
<body>

<h2>Apply for: {{ job.title }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Cover Letter:</label><br>
    {{ form.text }}<br><br>

    <label>Attach CV (optional):</label><br>
    {{ form.cv }}<br><br>

    <button type="submit">Submit Application</button>
</form>

<br>
<a href="{% url 'job_detail' job.id %}">← Back to job</a>

</body>
</html>
